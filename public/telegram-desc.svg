<svg width='640' height='360' viewBox='0 0 640 360' xmlns='http://www.w3.org/2000/svg'>
  <defs>
    <linearGradient id='bg' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#0F172A' />
      <stop offset='50%' stop-color='#1E1B4B' />
      <stop offset='100%' stop-color='#311042' />
    </linearGradient>
    <linearGradient id='accent' x1='0%' y1='0%' x2='100%' y2='0%'>
      <stop offset='0%' stop-color='#38BDF8' />
      <stop offset='100%' stop-color='#818CF8' />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width='640' height='360' rx='16' fill='url(#bg)'/>

  <!-- Subtle glow grid lines -->
  <circle cx='320' cy='180' r='140' fill='#6366F1' opacity='0.08' filter='blur(30px)'/>

  <!-- Badge Header -->
  <rect x='220' y='55' width='200' height='32' rx='16' fill='#1E293B' stroke='#334155' stroke-width='1.5'/>
  <text x='320' y='76' font-family='Arial, Helvetica, sans-serif' font-size='12' font-weight='bold' fill='#38BDF8' text-anchor='middle' letter-spacing='2'>OFFICIAL AI BOT</text>

  <!-- Main Brand Title -->
  <text x='320' y='145' font-family='Arial, Helvetica, sans-serif' font-size='40' font-weight='900' fill='#FFFFFF' text-anchor='middle'>BoonTrack<tspan fill='url(#accent)'> Shop</tspan></text>

  <!-- Subtitle -->
  <text x='320' y='185' font-family='Arial, Helvetica, sans-serif' font-size='16' fill='#94A3B8' text-anchor='middle'>Smart Order Automation &amp; AI Co-Pilot</text>

  <!-- Feature Pills -->
  <g transform='translate(95, 230)'>
    <!-- Pill 1 -->
    <rect x='0' y='0' width='140' height='40' rx='10' fill='#1E293B' stroke='#38BDF8' stroke-width='1'/>
    <text x='70' y='25' font-family='Arial, sans-serif' font-size='13' font-weight='bold' fill='#F8FAFC' text-anchor='middle'>⚡ Order Cepat WA</text>

    <!-- Pill 2 -->
    <rect x='155' y='0' width='140' height='40' rx='10' fill='#1E293B' stroke='#818CF8' stroke-width='1'/>
    <text x='225' y='25' font-family='Arial, sans-serif' font-size='13' font-weight='bold' fill='#F8FAFC' text-anchor='middle'>🔒 QRIS Otomatis</text>

    <!-- Pill 3 -->
    <rect x='310' y='0' width='140' height='40' rx='10' fill='#1E293B' stroke='#C084FC' stroke-width='1'/>
    <text x='380' y='25' font-family='Arial, sans-serif' font-size='13' font-weight='bold' fill='#F8FAFC' text-anchor='middle'>🤖 Co-Pilot @boon</text>
  </g>

  <!-- Bottom CTA hint -->
  <text x='320' y='320' font-family='Arial, Helvetica, sans-serif' font-size='13' fill='#64748B' text-anchor='middle'>Tekan tombol START untuk memulai percakapan</text>
</svg>
