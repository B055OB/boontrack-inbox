name: Inbox CI & Dispatch Test Suite

on:
  push:
    branches: [ main, 'ci/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Jest Unit Tests & Typecheck
    runs-on: ubuntu-latest

    env:
      CI: "true"
      NEXT_PUBLIC_SUPABASE_URL: "https://mock-project.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "dummy-anon-key-test"
      SUPABASE_SERVICE_ROLE_KEY: "dummy-service-role-test"
      R2_ACCESS_KEY_ID: "dummy-r2-key"
      R2_SECRET_ACCESS_KEY: "dummy-r2-secret"
      TELEGRAM_BOT_TOKEN: "dummy-telegram-token"
      R2_ACCOUNT_ID: "dummy-r2-account"
      R2_BUCKET_NAME: "dummy-media"
      R2_ENDPOINT_URL: "https://mock.r2.cloudflarestorage.com"
      R2_ENDPOINT: "https://mock.r2.cloudflarestorage.com"
      S3_ENDPOINT: "https://mock.r2.cloudflarestorage.com"
      R2_PUBLIC_DOMAIN: "https://assets.boontrack.com"
      EVOLUTION_API_KEY: "test_ci_evolution_api_key_placeholder"
      BOONTRACK_HMAC_SECRET: "test_ci_secure_hmac_secret_for_pipeline_999"
      TELEGRAM_BOT_USERNAME: "boonshop_bot"
      NEXT_PUBLIC_META_BOT_NUMBER: "6285181830080"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci || npm install --legacy-peer-deps
          npm install -D ts-node

      - name: Typecheck
        run: npm run typecheck || npx tsc --noEmit

      - name: Run Jest Test Suite
        run: npm test -- --coverage