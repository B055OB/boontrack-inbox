name: BoonTrack Workforce CI — Unit & Integration

on:
  push:
    branches: [ main, 'ci/**', feat/bwm-workforce-isolated ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Jest Unit & Mock Test Suite
    runs-on: ubuntu-latest

    env:
      CI: "true"
      NEXT_PUBLIC_SUPABASE_URL: "https://mock-project.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "dummy-anon-key-test"
      SUPABASE_SERVICE_ROLE_KEY: "dummy-service-role-test"
      WORKFORCE_SUPABASE_URL: "https://tjkbgxrckaocgosvmzmj.supabase.co"
      WORKFORCE_SUPABASE_ANON_KEY: "dummy-workforce-anon-key"
      R2_ACCESS_KEY_ID: "dummy-r2-key"
      R2_SECRET_ACCESS_KEY: "dummy-r2-secret"
      TELEGRAM_BOT_TOKEN: "dummy-telegram-token"
      R2_ACCOUNT_ID: "dummy-r2-account"
      R2_BUCKET_NAME: "dummy-media"
      R2_ENDPOINT_URL: "https://mock.r2.cloudflarestorage.com"
      R2_ENDPOINT: "https://mock.r2.cloudflarestorage.com"
      S3_ENDPOINT: "https://mock.r2.cloudflarestorage.com"
      R2_PUBLIC_DOMAIN: "https://assets.boontrack.com"
      EVOLUTION_API_KEY: "test_ci_evolution_api_key_placeholder"
      BOONTRACK_HMAC_SECRET: "test_ci_secure_hmac_secret_for_pipeline_999"
      TELEGRAM_BOT_USERNAME: "boonshop_bot"
      NEXT_PUBLIC_META_BOT_NUMBER: "6285181830080"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck || npx tsc --noEmit

      - name: Jest Unit & Mock Test Suite
        run: |
          node ./node_modules/jest/bin/jest.js --coverage --maxWorkers=2 \
            --testPathIgnorePatterns="__tests__/e2e/|__tests__/workforce/(api-authorization-convergence|attendance-checkpoint-postgres|attendance-postgrest-adapter|biteship-courier-config|database-rls-adversarial|e6-chargeback-dispute|e6-consumption-concurrency|e6-preview-readiness|e6-purchase-concurrency|e6-staging-db|e6-workforce-e2e|e8-staging-sandbox-integration|e9-dynamic-branding-pilot|e9-white-label-pilot|marginal-pricing-and-ledger|membership-revocation|persistent-registry-authority|public-route-exposure|public-tenant-dto-and-ingress|real-api-persistence|real-data-api-exposure|real-persistence-integration|role-authorization|rsc-and-dashboard-remediation|safe-migration-rollback|tenant-settings-api|tenant-operational-regression)"

  postgres_integration:
    name: Ephemeral PostgreSQL Integration (24 Suites)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password_disposable_ci_2026
          POSTGRES_DB: test_workforce_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: "true"
      NODE_ENV: "test"
      DISPOSABLE_POSTGRES_URL: "postgresql://postgres:test_password_disposable_ci_2026@localhost:5432/test_workforce_ci"
      WORKFORCE_DATABASE_DIRECT_URL: "postgresql://postgres:test_password_disposable_ci_2026@localhost:5432/test_workforce_ci"
      WORKFORCE_SUPABASE_URL: "https://tjkbgxrckaocgosvmzmj.supabase.co"
      WORKFORCE_SUPABASE_ANON_KEY: "dummy-workforce-anon-key"
      WORKFORCE_SUPABASE_SERVICE_ROLE_KEY: "dummy-workforce-service-role"
      NEXT_PUBLIC_SUPABASE_URL: "https://mock-project.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "dummy-anon-key-test"
      SUPABASE_SERVICE_ROLE_KEY: "dummy-service-role-test"
      BOONTRACK_HMAC_SECRET: "test_ci_secure_hmac_secret_for_pipeline_999"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Initialize DB Schema & Run Migrations (schema-draft.sql + 007-016)
        run: node scripts/verify-disposable-postgres-ci.mjs

      - name: Run Workstream A Authoritative PostgreSQL Gate (Attendance & Checkpoint Integrity)
        env:
          WORKFORCE_USE_DISPOSABLE_PG: "true"
        run: |
          node ./node_modules/jest/bin/jest.js --forceExit --testTimeout=30000 --runInBand \
            __tests__/workforce/attendance-checkpoint-postgres.test.ts

      - name: Run Workstream A M-2 Domain & Role Authorization Gate (role-authorization)
        run: |
          node ./node_modules/jest/bin/jest.js --forceExit --testTimeout=30000 --runInBand \
            __tests__/workforce/role-authorization.test.ts

      - name: Run Safe Migration Rollback Gate (016->009 Symmetrical Teardown & Re-apply)
        run: |
          node ./node_modules/jest/bin/jest.js --forceExit --testTimeout=30000 --runInBand \
            __tests__/workforce/safe-migration-rollback.test.ts

      - name: Run Workstream A Adversarial RLS & M-2 Isolation Gate (database-rls-adversarial)
        run: |
          node ./node_modules/jest/bin/jest.js --forceExit --testTimeout=30000 --runInBand \
            __tests__/workforce/database-rls-adversarial.test.ts

      - name: Run Legacy PostgreSQL Batch 1b (Schema & RLS — Known BWM-LEGACY-VIEW-001)
        continue-on-error: true
        run: |
          set +e
          node ./node_modules/jest/bin/jest.js --forceExit --testTimeout=30000 --runInBand \
            __tests__/workforce/api-authorization-convergence.test.ts \
            __tests__/workforce/membership-revocation.test.ts
          EXIT_CODE=$?
          echo "LEGACY_BATCH_1B_EXIT=$EXIT_CODE"
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "::warning::Legacy Batch 1b exited with $EXIT_CODE (decoupled under BWM-LEGACY-VIEW-001)"
          fi
          exit $EXIT_CODE

      - name: Run Legacy PostgreSQL Batch 2 (Concurrency & Finance — 7 Suites)
        continue-on-error: true
        run: |
          set +e
          node ./node_modules/jest/bin/jest.js --forceExit --testTimeout=60000 --runInBand \
            __tests__/workforce/e6-chargeback-dispute.test.ts \
            __tests__/workforce/e6-consumption-concurrency.test.ts \
            __tests__/workforce/e6-purchase-concurrency.test.ts \
            __tests__/workforce/e6-workforce-e2e.test.ts \
            __tests__/workforce/marginal-pricing-and-ledger.test.ts \
            __tests__/workforce/persistent-registry-authority.test.ts \
            __tests__/workforce/e8-staging-sandbox-integration.test.ts
          EXIT_CODE=$?
          echo "LEGACY_BATCH_2_EXIT=$EXIT_CODE"
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "::warning::Legacy Batch 2 exited with $EXIT_CODE (decoupled from Workstream A gate)"
          fi
          exit $EXIT_CODE

      - name: Run Legacy PostgreSQL Batch 3 (Staged & Brand Pilots — 5 Suites)
        continue-on-error: true
        run: |
          set +e
          node ./node_modules/jest/bin/jest.js --forceExit --testTimeout=30000 --runInBand \
            __tests__/workforce/e6-preview-readiness.test.ts \
            __tests__/workforce/e6-staging-db.test.ts \
            __tests__/workforce/e9-dynamic-branding-pilot.test.ts \
            __tests__/workforce/e9-white-label-pilot.test.ts \
            __tests__/workforce/biteship-courier-config.test.ts
          EXIT_CODE=$?
          echo "LEGACY_BATCH_3_EXIT=$EXIT_CODE"
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "::warning::Legacy Batch 3 exited with $EXIT_CODE (decoupled from Workstream A gate)"
          fi
          exit $EXIT_CODE

      - name: Run Legacy PostgreSQL Batch 4 (API & DTO Boundaries — Known BWM-LEGACY-VIEW-001)
        continue-on-error: true
        run: |
          set +e
          node ./node_modules/jest/bin/jest.js --forceExit --testTimeout=30000 --runInBand \
            __tests__/workforce/public-route-exposure.test.ts \
            __tests__/workforce/public-tenant-dto-and-ingress.test.ts \
            __tests__/workforce/real-api-persistence.test.ts \
            __tests__/workforce/real-persistence-integration.test.ts \
            __tests__/workforce/rsc-and-dashboard-remediation.test.ts \
            __tests__/workforce/tenant-settings-api.test.ts
          EXIT_CODE=$?
          echo "LEGACY_BATCH_4_EXIT=$EXIT_CODE"
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "::warning::Legacy Batch 4 exited with $EXIT_CODE (decoupled under BWM-LEGACY-VIEW-001)"
          fi
          exit $EXIT_CODE

  tenant_regression_integration:
    name: Tenant Operational Regression Integration (1 Suite)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password_disposable_ci_2026
          POSTGRES_DB: test_workforce_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: "true"
      NODE_ENV: "test"
      NODE_OPTIONS: "--experimental-vm-modules"
      DISPOSABLE_POSTGRES_URL: "postgresql://postgres:test_password_disposable_ci_2026@localhost:5432/test_workforce_ci"
      WORKFORCE_DATABASE_DIRECT_URL: "postgresql://postgres:test_password_disposable_ci_2026@localhost:5432/test_workforce_ci"
      WORKFORCE_SUPABASE_URL: "https://mock-project.supabase.co"
      WORKFORCE_SUPABASE_ANON_KEY: "dummy-workforce-anon-key"
      WORKFORCE_SUPABASE_SERVICE_ROLE_KEY: "dummy-workforce-service-role"
      NEXT_PUBLIC_SUPABASE_URL: "https://mock-project.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "dummy-anon-key-test"
      SUPABASE_SERVICE_ROLE_KEY: "dummy-service-role-test"
      BOONTRACK_HMAC_SECRET: "test_ci_secure_hmac_secret_for_pipeline_999"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Wait for PostgreSQL Readiness
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U postgres -d test_workforce_ci > /dev/null 2>&1; then
              echo "[READY] Disposable PostgreSQL container is healthy on port 5432"
              break
            fi
            echo "Waiting for PostgreSQL service container... ($i/30)"
            sleep 1
          done

      - name: Bootstrap Tenant Regression Schema & Constraints
        run: node scripts/bootstrap-tenant-regression-ci.mjs

      - name: Run Tenant Operational Regression Suite (1 Suite)
        run: |
          node ./node_modules/jest/bin/jest.js --forceExit --runInBand \
            __tests__/workforce/tenant-operational-regression.test.ts

  postgrest_integration:
    name: PostgREST & Auth Boundary Integration (2 Suites)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password_disposable_ci_2026
          POSTGRES_DB: test_workforce_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: "true"
      NODE_ENV: "test"
      DISPOSABLE_POSTGRES_URL: "postgresql://postgres:test_password_disposable_ci_2026@localhost:5432/test_workforce_ci"
      WORKFORCE_DATABASE_DIRECT_URL: "postgresql://postgres:test_password_disposable_ci_2026@localhost:5432/test_workforce_ci"
      WORKFORCE_SUPABASE_URL: "http://localhost:3000"
      WORKFORCE_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNjAwMDAwMDAwLCJleHAiOjIwMDAwMDAwMDB9.Rs4bVwQ_AdYuCzKpXE2AxvaLFxrdE6jNzkgdUgD-JC8"
      WORKFORCE_SUPABASE_SERVICE_ROLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIiwiaXNzIjoic3VwYWJhc2UiLCJpYXQiOjE2MDAwMDAwMDAsImV4cCI6MjAwMDAwMDAwMH0.dxvBMIvKaxIke61h0Jc2vPk9EZre-_1A3UQ5NXP9t5Y"
      BOONTRACK_HMAC_SECRET: "test_ci_secure_hmac_secret_for_pipeline_999"
      BWM_ALLOW_EPHEMERAL_SUPABASE_HTTP: "true"
      BWM_POSTGREST_INTEGRATION_TEST: "true"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Wait for PostgreSQL Readiness
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U postgres -d test_workforce_ci > /dev/null 2>&1; then
              echo "[READY] Disposable PostgreSQL container is healthy on port 5432"
              break
            fi
            echo "Waiting for PostgreSQL service container... ($i/30)"
            sleep 1
          done

      - name: Bootstrap Database Schema & Run Migrations (schema-draft.sql + 007-016)
        run: node scripts/verify-disposable-postgres-ci.mjs

      - name: Start Ephemeral GoTrue, PostgREST & Gateway Containers
        run: |
          # 1. Start GoTrue Auth Engine
          docker run -d --name gotrue --network host \
            -e GOTRUE_API_HOST="0.0.0.0" \
            -e GOTRUE_API_PORT="9999" \
            -e GOTRUE_DB_DRIVER="postgres" \
            -e GOTRUE_DB_DATABASE_URL="postgresql://postgres:test_password_disposable_ci_2026@127.0.0.1:5432/test_workforce_ci?search_path=auth,public&sslmode=disable" \
            -e GOTRUE_DB_NAMESPACE="auth" \
            -e API_EXTERNAL_URL="http://localhost:3000" \
            -e GOTRUE_SITE_URL="http://localhost:3000" \
            -e GOTRUE_URI_ALLOW_LIST="*" \
            -e GOTRUE_DISABLE_SIGNUP="false" \
            -e GOTRUE_JWT_SECRET="ci-only-jwt-secret-for-bwm-workforce-pipeline-2026-xyz-32bytes" \
            -e GOTRUE_JWT_EXP="3600" \
            -e GOTRUE_JWT_ADMIN_ROLES="service_role" \
            -e GOTRUE_JWT_AUD="authenticated" \
            -e GOTRUE_JWT_DEFAULT_GROUP_NAME="authenticated" \
            -e GOTRUE_EXTERNAL_EMAIL_ENABLED="true" \
            -e GOTRUE_MAILER_AUTOCONFIRM="true" \
            -e GOTRUE_LOG_LEVEL="info" \
            supabase/gotrue:v2.158.1

          # 2. Start PostgREST Data Engine (Runs under least-privileged authenticator role)
          docker run -d --name postgrest --network host \
            -e PGRST_DB_URI="postgresql://authenticator:authenticator_password_disposable_ci_2026@127.0.0.1:5432/test_workforce_ci" \
            -e PGRST_DB_SCHEMA="public,workforce_staging" \
            -e PGRST_DB_ANON_ROLE="anon" \
            -e PGRST_JWT_SECRET="ci-only-jwt-secret-for-bwm-workforce-pipeline-2026-xyz-32bytes" \
            -e PGRST_SERVER_PORT="3001" \
            postgrest/postgrest:v12.0.3

          # 3. Start Nginx Ephemeral API Gateway
          cat << 'EOF' > /tmp/nginx-gateway.conf
          events { worker_connections 1024; }
          http {
            server {
              listen 3000;
              location /auth/v1/ {
                proxy_pass http://127.0.0.1:9999/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
              }
              location /rest/v1/ {
                proxy_pass http://127.0.0.1:3001/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
              }
            }
          }
          EOF
          docker run -d --name api-gateway --network host -v /tmp/nginx-gateway.conf:/etc/nginx/nginx.conf:ro nginx:alpine

      - name: Wait for Ephemeral Gateway & Services Readiness
        run: |
          READY=false
          for i in $(seq 1 30); do
            if test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/auth/v1/health)" = "200" && curl -sf http://localhost:3000/rest/v1/ > /dev/null 2>&1; then
              echo "[READY] Ephemeral API Gateway (GoTrue & PostgREST) is reachable on port 3000"
              READY=true
              break
            fi
            echo "Waiting for services... ($i/30)"
            sleep 2
          done
          if [ "$READY" != "true" ]; then
            echo "[TIMEOUT ERROR] Ephemeral services failed to become ready within 60s"
            docker logs gotrue || true
            docker logs postgrest || true
            docker logs api-gateway || true
            exit 1
          fi

          SCHEMA_READY=false
          for i in $(seq 1 20); do
            ATT_RESP=$(curl -s -X POST "http://localhost:3000/rest/v1/rpc/record_attendance_atomic" \
              -H "apikey: ${WORKFORCE_SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Authorization: Bearer ${WORKFORCE_SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Content-Profile: workforce_staging" \
              -H "Content-Type: application/json" \
              -d '{"p_id":"00000000-0000-4000-8000-000000000931","p_tenant_id":"00000000-0000-4000-8000-000000000932","p_personnel_id":"00000000-0000-4000-8000-000000000933","p_expected_user_id":"00000000-0000-4000-8000-000000000934","p_facility_id":null,"p_type":"CLOCK_IN","p_timestamp":"2026-01-01T00:00:00Z","p_latitude":-6.2088,"p_longitude":106.8456,"p_geofence_verified":true,"p_biometric_mode":"NONE_UNVERIFIED","p_photo_url":null,"p_idempotency_key":"ci-schema-probe-att"}')
            SCAN_RESP=$(curl -s -X POST "http://localhost:3000/rest/v1/rpc/record_checkpoint_scan_atomic" \
              -H "apikey: ${WORKFORCE_SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Authorization: Bearer ${WORKFORCE_SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Content-Profile: workforce_staging" \
              -H "Content-Type: application/json" \
              -d '{"p_id":"00000000-0000-4000-8000-000000000941","p_tenant_id":"00000000-0000-4000-8000-000000000932","p_checkpoint_id":"00000000-0000-4000-8000-000000000942","p_personnel_id":"00000000-0000-4000-8000-000000000933","p_expected_user_id":"00000000-0000-4000-8000-000000000934","p_qr_token":"PROBE-NONE","p_scanned_at":"2026-01-01T00:00:00Z","p_latitude":-6.2088,"p_longitude":106.8456,"p_distance_m":0,"p_status":"VERIFIED","p_idempotency_key":"ci-schema-probe-scan"}')
            if echo "$ATT_RESP" | grep -q '"outcome"' && echo "$SCAN_RESP" | grep -q '"outcome"'; then
              echo "[READY] PostgREST HTTP schema cache exposed 13-arg/12-arg RPC signatures cleanly"
              SCHEMA_READY=true
              break
            fi
            echo "Waiting for PostgREST schema cache RPC exposure... ($i/20)"
            sleep 1
          done
          if [ "$SCHEMA_READY" != "true" ]; then
            echo "[TIMEOUT ERROR] PostgREST schema cache failed to expose 13-arg/12-arg RPCs"
            docker logs postgrest || true
            exit 1
          fi

      - name: Run Workstream A PostgREST Adapter Gate (attendance-postgrest-adapter)
        run: |
          node ./node_modules/jest/bin/jest.js --forceExit --testTimeout=60000 --runInBand \
            __tests__/workforce/attendance-postgrest-adapter.test.ts

      - name: Run Legacy PostgREST Data API Exposure Suite (real-data-api-exposure — Decoupled)
        continue-on-error: true
        run: |
          set +e
          node ./node_modules/jest/bin/jest.js --forceExit --testTimeout=60000 --runInBand \
            __tests__/workforce/real-data-api-exposure.test.ts
          EXIT_CODE=$?
          echo "LEGACY_REAL_DATA_API_EXIT=$EXIT_CODE"
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "::warning::Legacy real-data-api-exposure exited with $EXIT_CODE (decoupled from Workstream A gate)"
          fi
          exit $EXIT_CODE

      - name: Teardown Ephemeral Containers
        if: always()
        run: |
          docker rm -f api-gateway postgrest gotrue || true
