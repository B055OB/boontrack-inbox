name: Inbox CI & Dispatch Test Suite

on:
  push:
    branches: [ main, 'ci/**', feat/bwm-workforce-isolated ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Jest Unit & Mock Test Suite (213 Suites)
    runs-on: ubuntu-latest

    env:
      CI: "true"
      NEXT_PUBLIC_SUPABASE_URL: "https://mock-project.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "dummy-anon-key-test"
      SUPABASE_SERVICE_ROLE_KEY: "dummy-service-role-test"
      WORKFORCE_SUPABASE_URL: "https://tjkbgxrckaocgosvmzmj.supabase.co"
      WORKFORCE_SUPABASE_ANON_KEY: "dummy-workforce-anon-key"
      R2_ACCESS_KEY_ID: "dummy-r2-key"
      R2_SECRET_ACCESS_KEY: "dummy-r2-secret"
      TELEGRAM_BOT_TOKEN: "dummy-telegram-token"
      R2_ACCOUNT_ID: "dummy-r2-account"
      R2_BUCKET_NAME: "dummy-media"
      R2_ENDPOINT_URL: "https://mock.r2.cloudflarestorage.com"
      R2_ENDPOINT: "https://mock.r2.cloudflarestorage.com"
      S3_ENDPOINT: "https://mock.r2.cloudflarestorage.com"
      R2_PUBLIC_DOMAIN: "https://assets.boontrack.com"
      EVOLUTION_API_KEY: "test_ci_evolution_api_key_placeholder"
      BOONTRACK_HMAC_SECRET: "test_ci_secure_hmac_secret_for_pipeline_999"
      TELEGRAM_BOT_USERNAME: "boonshop_bot"
      NEXT_PUBLIC_META_BOT_NUMBER: "6285181830080"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck || npx tsc --noEmit

      - name: Run Jest Unit & Mock Suites (213 Suites)
        run: |
          node ./node_modules/jest/bin/jest.js --coverage --maxWorkers=2 \
            --testPathIgnorePatterns="__tests__/e2e/|__tests__/workforce/(api-authorization-convergence|biteship-courier-config|database-rls-adversarial|e6-chargeback-dispute|e6-consumption-concurrency|e6-preview-readiness|e6-purchase-concurrency|e6-staging-db|e6-workforce-e2e|e8-staging-sandbox-integration|e9-dynamic-branding-pilot|e9-white-label-pilot|marginal-pricing-and-ledger|membership-revocation|persistent-registry-authority|public-route-exposure|public-tenant-dto-and-ingress|real-api-persistence|real-data-api-exposure|real-persistence-integration|role-authorization|rsc-and-dashboard-remediation|safe-migration-rollback|tenant-settings-api)"

  postgres_integration:
    name: Ephemeral PostgreSQL Integration (23 Suites)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password_disposable_ci_2026
          POSTGRES_DB: test_workforce_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: "true"
      NODE_ENV: "test"
      DISPOSABLE_POSTGRES_URL: "postgresql://postgres:test_password_disposable_ci_2026@localhost:5432/test_workforce_ci"
      WORKFORCE_DATABASE_DIRECT_URL: "postgresql://postgres:test_password_disposable_ci_2026@localhost:5432/test_workforce_ci"
      WORKFORCE_SUPABASE_URL: "https://tjkbgxrckaocgosvmzmj.supabase.co"
      WORKFORCE_SUPABASE_ANON_KEY: "dummy-workforce-anon-key"
      WORKFORCE_SUPABASE_SERVICE_ROLE_KEY: "dummy-workforce-service-role"
      NEXT_PUBLIC_SUPABASE_URL: "https://mock-project.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "dummy-anon-key-test"
      SUPABASE_SERVICE_ROLE_KEY: "dummy-service-role-test"
      BOONTRACK_HMAC_SECRET: "test_ci_secure_hmac_secret_for_pipeline_999"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Initialize DB Schema & Run Migrations (schema-draft.sql + 007-012)
        run: node scripts/verify-disposable-postgres-ci.mjs

      - name: Run PostgreSQL Integration Batch 1 (Schema & RLS — 5 Suites)
        run: |
          node ./node_modules/jest/bin/jest.js --forceExit --testTimeout=30000 --runInBand \
            __tests__/workforce/api-authorization-convergence.test.ts \
            __tests__/workforce/database-rls-adversarial.test.ts \
            __tests__/workforce/membership-revocation.test.ts \
            __tests__/workforce/role-authorization.test.ts \
            __tests__/workforce/safe-migration-rollback.test.ts

      - name: Run PostgreSQL Integration Batch 2 (Concurrency & Finance — 7 Suites)
        run: |
          node ./node_modules/jest/bin/jest.js --forceExit --testTimeout=60000 --runInBand \
            __tests__/workforce/e6-chargeback-dispute.test.ts \
            __tests__/workforce/e6-consumption-concurrency.test.ts \
            __tests__/workforce/e6-purchase-concurrency.test.ts \
            __tests__/workforce/e6-workforce-e2e.test.ts \
            __tests__/workforce/marginal-pricing-and-ledger.test.ts \
            __tests__/workforce/persistent-registry-authority.test.ts \
            __tests__/workforce/e8-staging-sandbox-integration.test.ts

      - name: Run PostgreSQL Integration Batch 3 (Staged & Brand Pilots — 5 Suites)
        run: |
          node ./node_modules/jest/bin/jest.js --forceExit --testTimeout=30000 --runInBand \
            __tests__/workforce/e6-preview-readiness.test.ts \
            __tests__/workforce/e6-staging-db.test.ts \
            __tests__/workforce/e9-dynamic-branding-pilot.test.ts \
            __tests__/workforce/e9-white-label-pilot.test.ts \
            __tests__/workforce/biteship-courier-config.test.ts

      - name: Run PostgreSQL Integration Batch 4 (API & DTO Boundaries — 6 Suites)
        run: |
          node ./node_modules/jest/bin/jest.js --forceExit --testTimeout=30000 --runInBand \
            __tests__/workforce/public-route-exposure.test.ts \
            __tests__/workforce/public-tenant-dto-and-ingress.test.ts \
            __tests__/workforce/real-api-persistence.test.ts \
            __tests__/workforce/real-persistence-integration.test.ts \
            __tests__/workforce/rsc-and-dashboard-remediation.test.ts \
            __tests__/workforce/tenant-settings-api.test.ts

  postgrest_integration:
    name: PostgREST & Auth Boundary Integration (1 Suite)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password_disposable_ci_2026
          POSTGRES_DB: test_workforce_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: "true"
      NODE_ENV: "test"
      DISPOSABLE_POSTGRES_URL: "postgresql://postgres:test_password_disposable_ci_2026@localhost:5432/test_workforce_ci"
      WORKFORCE_DATABASE_DIRECT_URL: "postgresql://postgres:test_password_disposable_ci_2026@localhost:5432/test_workforce_ci"
      WORKFORCE_SUPABASE_URL: "http://localhost:3000"
      WORKFORCE_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNjAwMDAwMDAwLCJleHAiOjIwMDAwMDAwMDB9.Rs4bVwQ_AdYuCzKpXE2AxvaLFxrdE6jNzkgdUgD-JC8"
      WORKFORCE_SUPABASE_SERVICE_ROLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIiwiaXNzIjoic3VwYWJhc2UiLCJpYXQiOjE2MDAwMDAwMDAsImV4cCI6MjAwMDAwMDAwMH0.dxvBMIvKaxIke61h0Jc2vPk9EZre-_1A3UQ5NXP9t5Y"
      BOONTRACK_HMAC_SECRET: "test_ci_secure_hmac_secret_for_pipeline_999"
      BWM_ALLOW_EPHEMERAL_SUPABASE_HTTP: "true"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Wait for PostgreSQL Readiness
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U postgres -d test_workforce_ci > /dev/null 2>&1; then
              echo "[READY] Disposable PostgreSQL container is healthy on port 5432"
              break
            fi
            echo "Waiting for PostgreSQL service container... ($i/30)"
            sleep 1
          done

      - name: Bootstrap Database Schema & Run Migrations (schema-draft.sql + 007-012)
        run: node scripts/verify-disposable-postgres-ci.mjs

      - name: Start Ephemeral GoTrue, PostgREST & Gateway Containers
        run: |
          # 1. Start GoTrue Auth Engine
          docker run -d --name gotrue --network host \
            -e GOTRUE_API_HOST="0.0.0.0" \
            -e GOTRUE_API_PORT="9999" \
            -e GOTRUE_DB_DRIVER="postgres" \
            -e GOTRUE_DB_DATABASE_URL="postgresql://postgres:test_password_disposable_ci_2026@127.0.0.1:5432/test_workforce_ci?sslmode=disable" \
            -e GOTRUE_SITE_URL="http://localhost:3000" \
            -e GOTRUE_URI_ALLOW_LIST="*" \
            -e GOTRUE_DISABLE_SIGNUP="false" \
            -e GOTRUE_JWT_SECRET="ci-only-jwt-secret-for-bwm-workforce-pipeline-2026-xyz-32bytes" \
            -e GOTRUE_JWT_EXP="3600" \
            -e GOTRUE_JWT_ADMIN_ROLES="service_role" \
            -e GOTRUE_JWT_AUD="authenticated" \
            -e GOTRUE_JWT_DEFAULT_GROUP_NAME="authenticated" \
            -e GOTRUE_EXTERNAL_EMAIL_ENABLED="true" \
            -e GOTRUE_MAILER_AUTOCONFIRM="true" \
            -e GOTRUE_LOG_LEVEL="info" \
            supabase/gotrue:v2.158.1

          # 2. Start PostgREST Data Engine (Runs under least-privileged authenticator role)
          docker run -d --name postgrest --network host \
            -e PGRST_DB_URI="postgresql://authenticator:authenticator_password_disposable_ci_2026@127.0.0.1:5432/test_workforce_ci" \
            -e PGRST_DB_SCHEMA="public" \
            -e PGRST_DB_ANON_ROLE="anon" \
            -e PGRST_JWT_SECRET="ci-only-jwt-secret-for-bwm-workforce-pipeline-2026-xyz-32bytes" \
            -e PGRST_SERVER_PORT="3001" \
            postgrest/postgrest:v12.0.3

          # 3. Start Nginx Ephemeral API Gateway
          cat << 'EOF' > /tmp/nginx-gateway.conf
          events { worker_connections 1024; }
          http {
            server {
              listen 3000;
              location /auth/v1/ {
                proxy_pass http://127.0.0.1:9999/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
              }
              location /rest/v1/ {
                proxy_pass http://127.0.0.1:3001/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
              }
            }
          }
          EOF
          docker run -d --name api-gateway --network host -v /tmp/nginx-gateway.conf:/etc/nginx/nginx.conf:ro nginx:alpine

      - name: Wait for Ephemeral Gateway & Services Readiness
        run: |
          READY=false
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/auth/v1/health > /dev/null 2>&1 && curl -sf http://localhost:3000/rest/v1/ > /dev/null 2>&1; then
              echo "[READY] Ephemeral API Gateway (GoTrue & PostgREST) is fully operational on port 3000"
              READY=true
              break
            fi
            echo "Waiting for services... ($i/30)"
            sleep 2
          done
          if [ "$READY" != "true" ]; then
            echo "[TIMEOUT ERROR] Ephemeral services failed to become ready within 60s"
            docker logs gotrue || true
            docker logs postgrest || true
            docker logs api-gateway || true
            exit 1
          fi

      - name: Run PostgREST Boundary Suite (1 Suite)
        run: |
          node ./node_modules/jest/bin/jest.js --forceExit --testTimeout=60000 --runInBand \
            __tests__/workforce/real-data-api-exposure.test.ts

      - name: Teardown Ephemeral Containers
        if: always()
        run: |
          docker rm -f api-gateway postgrest gotrue || true
